# ARTEX Tencent TSec Benchmark image -- build and run locally in one step.
# This is separate from the production docker-compose.yml (artex + postgres).
# Usage:
#   cp bench/.env.example bench/.env   # Set LLM_API_KEY, BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in the foreground (view logs).
#   docker compose -f docker-compose.bench.yml up --build -d   # Run in the background.
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop (add -v to remove volumes too).
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD).

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host network so the container can reach target networks through the host or VPN.
    # Host mode needs no port mappings; the container binds directly to host ports 8787 (UI/API),
    # 8788 (proxy), and 5432 (internal PostgreSQL). Ensure these ports are free before local testing.
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
